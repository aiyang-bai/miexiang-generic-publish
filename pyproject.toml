[build-system]
requires = ["setuptools==83.0.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "miexiang-generic-publish"
version = "0.2.0rc1"
description = "Single-artifact release publisher with remote SHA-256 verification"
requires-python = ">=3.11,<3.13"
dependencies = []
readme = "README.md"
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/aiyang-bai/miexiang-generic-publish"
Issues = "https://github.com/aiyang-bai/miexiang-generic-publish/issues"

[project.optional-dependencies]
cos = ["cos-python-sdk-v5==1.9.44"]

[project.scripts]
miexiang-publish = "miexiang_publish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
