name: contracts-and-install
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
        cos: [false, true]
    env:
      MIEXIANG_PUBLISH_DATA_DIR: ${{ github.workspace }}/.maintenance/ci-data
      TEMP: ${{ github.workspace }}/.maintenance/tmp
      TMP: ${{ github.workspace }}/.maintenance/tmp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare disposable directories
        shell: pwsh
        run: New-Item -ItemType Directory -Force .maintenance/tmp | Out-Null
      - run: python -m pip install -r requirements-build.lock
      - if: matrix.cos
        run: python -m pip install -r requirements-cos.lock
      - run: python scripts/build_candidate.py
      - name: Install actual wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          python -m pip install --no-deps $wheel
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_install.py
      - run: python scripts/audit_public.py
